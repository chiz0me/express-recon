name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Node 22 bundles npm 10.x; trusted publishing requires npm >= 11.5.1.
      # Pin the toolchain so a new npm release cannot change release behavior.
      - run: npm install --ignore-scripts -g npm@11.18.0

      - run: npm ci --ignore-scripts

      - name: Verify package, plugin manifest, and release tag agree
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/check-version.js "$RELEASE_TAG"

      - run: npm run check

      - run: npm run audit:prod

      - run: npm pack --dry-run

      - run: npm publish --provenance --access public
