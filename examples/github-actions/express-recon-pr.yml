# Express Recon PR security review (JSON/Markdown; intentionally no SARIF).
#
# Prerequisites in the consuming Express repository:
#   1. Add express-recon as a pinned devDependency and commit package-lock.json.
#   2. Commit a data-only recon.config.json.
#   3. Protect this workflow, package-lock.json, recon.config.json, and
#      .express-reconignore with CODEOWNERS/required review.
#
# Copy this file to .github/workflows/express-recon.yml.
name: Express route security review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: express-recon-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: current
          persist-credentials: false

      - name: Check out the base branch revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: baseline/package-lock.json

      # The scanner, policy, and ignore rules come from the trusted base SHA.
      # A PR can propose updates to them, but cannot weaken its own gate.
      - name: Prepare the trusted scanner and scope policy
        shell: bash
        run: |
          test -f baseline/package-lock.json
          test -f baseline/recon.config.json
          npm ci --ignore-scripts --prefix baseline
          if [[ -f baseline/.express-reconignore ]]; then
            cp -- baseline/.express-reconignore "$RUNNER_TEMP/express-recon-pr.ignore"
          else
            : > "$RUNNER_TEMP/express-recon-pr.ignore"
          fi

      - name: Build the base-branch report
        run: |
          baseline/node_modules/.bin/express-recon audit \
            --src baseline \
            --config baseline/recon.config.json \
            --ignore-file "$RUNNER_TEMP/express-recon-pr.ignore" \
            --format json \
            --out baseline-results \
            --fail-on incomplete

      - name: Audit the PR and capture the gate result
        id: audit
        shell: bash
        run: |
          set +e
          baseline/node_modules/.bin/express-recon audit \
            --src current \
            --config baseline/recon.config.json \
            --ignore-file "$RUNNER_TEMP/express-recon-pr.ignore" \
            --baseline baseline-results/routes.json \
            --format json,md \
            --out current-results \
            --fail-on new,regression,incomplete
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Add delta findings and annotations to the PR checks
        if: always() && hashFiles('current-results/routes.json') != ''
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const MAX_ANNOTATIONS = 50;
          const MAX_SUMMARY_ITEMS = 50;
          const report = JSON.parse(fs.readFileSync("current-results/routes.json", "utf8"));
          const root = path.resolve("current");
          let annotations = 0;
          const relativeSource = (source) => {
            if (!source?.file) return null;
            const candidate = path.isAbsolute(source.file)
              ? path.relative(root, source.file)
              : source.file;
            const relative = path.posix.normalize(candidate.split(path.sep).join("/"));
            return relative === ".." || relative.startsWith("../") || path.posix.isAbsolute(relative)
              ? null
              : relative;
          };
          const markdownText = (value) =>
            String(value)
              .replaceAll("\r", " ")
              .replaceAll("\n", " ")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll("\\", "\\\\")
              .replace(/([`*_[\]{}()#+.!|])/g, "\\$1");
          const link = (source) => {
            const file = relativeSource(source);
            if (!file) return "location unavailable";
            const encoded = file.split("/").map(encodeURIComponent).join("/");
            const line = source.line ? `#L${source.line}` : "";
            const label = markdownText(`${file}:${source.line ?? "?"}`);
            return `[${label}](https://github.com/${process.env.REPOSITORY}/blob/${process.env.HEAD_SHA}/${encoded}${line})`;
          };
          const inlineCode = (value) =>
            `\`${String(value).replaceAll("`", "ˋ").replaceAll("\r", " ").replaceAll("\n", " ")}\``;
          const escapeData = (value) =>
            String(value).replaceAll("%", "%25").replaceAll("\r", "%0D").replaceAll("\n", "%0A");
          const escapeProperty = (value) =>
            escapeData(value).replaceAll(":", "%3A").replaceAll(",", "%2C");
          const annotate = (finding) => {
            if (annotations >= MAX_ANNOTATIONS) return;
            const file = relativeSource(finding.source);
            if (!file) return;
            annotations++;
            const level = finding.severity === "high" ? "error" : "warning";
            const props = [
              `file=${escapeProperty(file)}`,
              finding.source.line ? `line=${finding.source.line}` : null,
              `title=${escapeProperty(`${finding.severity}: ${finding.ruleId}`)}`,
            ].filter(Boolean).join(",");
            console.log(
              `::${level} ${props}::${escapeData(`${finding.method || ""} ${finding.path || ""} — ${finding.detail} (${finding.fingerprint})`)}`,
            );
          };

          const delta = report.delta;
          let remaining = MAX_SUMMARY_ITEMS;
          const take = (items) => {
            const selected = items.slice(0, remaining);
            remaining -= selected.length;
            return selected;
          };
          const lines = [
            "## Express Recon: PR delta",
            "",
            `New findings: **${delta.summary.newFindings}** · Auth regressions: **${delta.summary.authRegressions}** · Added routes: **${delta.summary.addedRoutes}**`,
            "",
          ];
          if (delta.newFindings.length) {
            lines.push("### Net-new findings", "");
            for (const finding of take(delta.newFindings)) {
              annotate(finding);
              lines.push(
                `- **${markdownText(finding.severity)}** · **${markdownText(finding.ruleId)}** · ${inlineCode(`${finding.method || ""} ${finding.path || ""}`)} · ${link(finding.source)} · ${inlineCode(finding.fingerprint)}`,
              );
            }
            if (delta.newFindings.length > MAX_SUMMARY_ITEMS) {
              lines.push(`- ${delta.newFindings.length - MAX_SUMMARY_ITEMS} additional finding(s) are available in the report artifact.`);
            }
            lines.push("");
          }
          if (delta.authRegressions.length) {
            lines.push("### Authentication regressions", "");
            const selected = take(delta.authRegressions);
            for (const change of selected) {
              lines.push(
                `- ${inlineCode(`${change.method} ${change.path}`)} · ${link(change.source)} — ${markdownText(change.from)} → **${markdownText(change.to)}**. ${markdownText(change.explanation)}`,
              );
            }
            if (selected.length < delta.authRegressions.length) {
              lines.push(`- ${delta.authRegressions.length - selected.length} additional regression(s) are available in the report artifact.`);
            }
            lines.push("");
          }
          if (delta.newFindings.length > MAX_ANNOTATIONS) {
            lines.push(`Annotations were capped at ${MAX_ANNOTATIONS}; use the report artifact for the complete result.`, "");
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join("\n")}\n`);
          NODE

      - name: Upload full JSON and Markdown reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: express-recon-pr-${{ github.event.pull_request.number }}
          path: |
            baseline-results/routes.json
            current-results/routes.json
            current-results/routes.md
          if-no-files-found: error
          retention-days: 14

      - name: Enforce the PR gate
        if: always()
        shell: bash
        run: |
          exit_code="${{ steps.audit.outputs.exit_code }}"
          if [[ -z "$exit_code" ]]; then
            echo "express-recon did not produce a gate result" >&2
            exit 1
          fi
          exit "$exit_code"
